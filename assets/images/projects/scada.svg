    <text x="15" y="25" fill="#94A3B8" font-family="monospace" font-size="10">TURBINE_RPM</text>
    <text x="15" y="55" fill="#06B6D4" font-family="monospace" font-size="20" font-weight="bold">2,840</text>
    <rect x="150" y="0" width="130" height="80" rx="6" fill="#0F172A" stroke="#2563EB"/>
    <text x="165" y="25" fill="#94A3B8" font-family="monospace" font-size="10">GRID_LOAD</text>
