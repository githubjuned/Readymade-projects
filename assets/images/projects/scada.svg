    <rect x="0" y="100" width="440" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
    <path d="M 10 170 Q 70 120 130 170 T 250 170 T 370 170 T 430 150" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
