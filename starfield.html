<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starfield Close</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }
    body {
      height: 100%;
      overflow-x: hidden;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #scroll-host {
      height: 300vh;
    }
    #scroll-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(174, 246, 207, 0.4);
      font-family: monospace, sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="scroll-host"></div>
  <div id="scroll-hint">scroll &darr;</div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
    import { CopyShader } from 'three/addons/shaders/CopyShader.js';

    // Fixed parameters (bake these in)
    const CONFIG = {
      bgColor: '#0a0a24',      // dark complementary background tint
      flameColor: '#aee9ff',   // corner-flame color A
      flameColor2: '#c79bff',  // corner-flame color B
      flameAmt: 0.2,           // corner-flame intensity
      colorA: '#aef6cf',       // star tint A (mint)
      colorB: '#5fe6a0',       // star tint B (jade)
      colorC: '#eafff2',       // star tint C (bone)
      opacity: 2,
      pointSize: 50,
      brightness: 1.85,
      drift: 2.35,             // steady tunnel speed
      twinkle: 1,
      spin: 0.03,              // barrel rotation rate
      repelRadius: 5,
      repelStrength: 0.35,
      scrollPush: 8,           // forward camera dive on scroll
      scrollDrift: 6,          // extra drift surge on scroll
      scrollSpin: 0.1,         // extra spin on scroll
      parallax: 0.6,           // cursor camera offset
    };

    // Helpers
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    function hexToVec3(hex) {
      const n = parseInt(hex.slice(1), 16);
      return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }

    // Canvas & Renderer
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap;

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 0, 15);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 5);

    // Layers
    const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 };
    camera.layers.enable(LAYERS.TORUS_SCENE);
    camera.layers.enable(LAYERS.BLOOM_SCENE);
    camera.layers.enable(LAYERS.ENTIRE_SCENE);
    scene.add(camera);

    // Shared RenderPass
    const renderScene = new RenderPass(scene, camera);

    // torusComposer (renderToScreen = false)
    const torusComposer = new EffectComposer(renderer);
    torusComposer.renderToScreen = false;
    torusComposer.addPass(renderScene);
    torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
    torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.2, 0));
    torusComposer.addPass(new ShaderPass(CopyShader));

    // bloomComposer (renderToScreen = false)
    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(renderScene);
    bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.55, 0));
    bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

    // FinalPass Shader & Composer
    const FinalShader = {
      uniforms: {
        iTime:        { value: 0 },
        tDiffuse:     { value: null },
        torusTexture: { value: null },
        bloomTexture: { value: null },
        haloTexture:  { value: null },
        uBg:          { value: hexToVec3(CONFIG.bgColor) },
        uFlameA:      { value: hexToVec3(CONFIG.flameColor) },
        uFlameB:      { value: hexToVec3(CONFIG.flameColor2) },
        uFlameAmt:    { value: CONFIG.flameAmt }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
      fragmentShader: `
uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.x+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}
      `
    };

    const finalPass = new ShaderPass(FinalShader);
    finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
    finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;

    const finalComposer = new EffectComposer(renderer);
    finalComposer.addPass(renderScene);
    finalComposer.addPass(finalPass);

    // Geometry: Starfield Points Cloud
    const count = 4200;
    const depth = 30;

    const positions = new Float32Array(count * 3);
    const palette = new Float32Array(count);
    const bright = new Float32Array(count);
    const scales = new Float32Array(count);
    const phases = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      positions[i3]     = (Math.random() - 0.5) * 24;  // x: box width 24
      positions[i3 + 1] = (Math.random() - 0.5) * 16;  // y: box height 16
      positions[i3 + 2] = (Math.random() - 0.5) * 30;  // z: box depth 30 (== depth, for seamless wrap)
      palette[i] = Math.floor(Math.random() * 3);      // 0 / 1 / 2 → tint A / B / C
      bright[i]  = 0.7 + Math.random() * 0.6;
      scales[i]  = 0.5 + Math.pow(Math.random(), 1.4) * 2.5;
      phases[i]  = Math.random();
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
    geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
    geometry.setAttribute('aPalette', new THREE.BufferAttribute(palette, 1));
    geometry.setAttribute('aBright', new THREE.BufferAttribute(bright, 1));

    // Material & Shaders
    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime:          { value: 0 },
        uSize:          { value: CONFIG.pointSize },
        uOpacity:       { value: 0 },
        uDrift:         { value: 0 },
        uDepth:         { value: depth },
        uTwinkle:       { value: CONFIG.twinkle },
        uCursor:        { value: new THREE.Vector3() },
        uRepelRadius:   { value: CONFIG.repelRadius },
        uRepelStrength: { value: CONFIG.repelStrength },
        uActivity:      { value: 0 },
        uColorA:        { value: hexToVec3(CONFIG.colorA) },
        uColorB:        { value: hexToVec3(CONFIG.colorB) },
        uColorC:        { value: hexToVec3(CONFIG.colorC) },
        uBrightness:    { value: CONFIG.brightness }
      },
      vertexShader: `
uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uDepth; uniform float uTwinkle;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
attribute float aScale; attribute float aPhase; attribute float aPalette; attribute float aBright;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec3 pos = position;
  // Endless drift toward +Z with mod-wrap.
  pos.z = mod(pos.z + uDrift + (uDepth * 0.5), uDepth) - (uDepth * 0.5);

  float tw = sin(uTime * 1.6 + aPhase * 6.2831);
  vTwinkle = (1.0 - uTwinkle) + uTwinkle * (0.55 + 0.45 * tw);

  vec4 modelPosition = modelMatrix * vec4(pos, 1.0);

  vec3 toParticle = modelPosition.xyz - uCursor;
  float dist = length(toParticle);
  float falloff = smoothstep(uRepelRadius, 0.0, dist);
  modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity;

  vec4 viewPosition = viewMatrix * modelPosition;
  gl_Position = projectionMatrix * viewPosition;
  gl_PointSize = uSize * aScale;
  gl_PointSize *= (1.0 / -viewPosition.z);

  vec3 base = aPalette < 0.5 ? uColorA : (aPalette < 1.5 ? uColorB : uColorC);
  vColor = base * aBright;
}
      `,
      fragmentShader: `
uniform float uOpacity; uniform float uBrightness;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.0);
  vec3 color = mix(vec3(0.0), vColor, strength);
  gl_FragColor = vec4(color * uBrightness, strength * uOpacity * vTwinkle);
}
      `
    });

    const points = new THREE.Points(geometry, material);
    points.frustumCulled = false;
    points.layers.enable(LAYERS.ENTIRE_SCENE);

    const group = new THREE.Group();
    group.layers.enable(LAYERS.ENTIRE_SCENE);
    group.add(points);
    scene.add(group);

    // Scroll input (double-damped)
    let scrollTarget = 0;
    let scrollSmooth = 0;
    let scrollCurrent = 0;

    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
    }, { passive: true });

    // Pointer input
    const mouseTarget = { x: 0, y: 0 };
    const mouseSmooth = { x: 0, y: 0 };
    const POINTER = {
      world: new THREE.Vector3(),
      activity: 0,
      active: false,
      lastMove: performance.now()
    };

    window.addEventListener('mousemove', (e) => {
      mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseTarget.y = -((e.clientY / window.innerHeight) * 2 - 1);
      POINTER.active = true;
      POINTER.lastMove = performance.now();
    }, { passive: true });

    window.addEventListener('mouseout', () => {
      POINTER.active = false;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        mouseTarget.x = (t.clientX / window.innerWidth) * 2 - 1;
        mouseTarget.y = -((t.clientY / window.innerHeight) * 2 - 1);
        POINTER.active = true;
        POINTER.lastMove = performance.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      POINTER.active = false;
    }, { passive: true });

    const _ndc = new THREE.Vector3(), _dir = new THREE.Vector3(), _tgt = new THREE.Vector3();
    function updatePointer() {
      _tgt.set(0, 0, 0);
      if (POINTER.active) {
        _ndc.set(mouseSmooth.x, mouseSmooth.y, 0.5).unproject(camera);
        _dir.copy(_ndc).sub(camera.position).normalize();
        const dn = _dir.z;
        if (Math.abs(dn) > 1e-4) {
          const tt = -camera.position.z / dn;
          if (tt > 0 && Number.isFinite(tt)) {
            _tgt.copy(camera.position).addScaledVector(_dir, tt);
          }
        }
      }
      POINTER.world.lerp(_tgt, 0.12);
      const idle = (performance.now() - POINTER.lastMove) / 1000;
      const want = (POINTER.active && idle < 3) ? 1 : 0;
      POINTER.activity += (want - POINTER.activity) * 0.06;

      material.uniforms.uCursor.value.copy(POINTER.world);
      material.uniforms.uActivity.value = POINTER.activity;
    }

    // Per-frame scene update parameters
    let t0 = performance.now() / 1000;
    const appearStart = performance.now();
    let uDrift = 0;

    // Render loop
    function animate() {
      requestAnimationFrame(animate);

      // Advance scroll and mouse smooth
      scrollSmooth = lerp(scrollSmooth, scrollTarget, 0.10);
      scrollCurrent = lerp(scrollCurrent, scrollSmooth, 0.06);
      mouseSmooth.x = lerp(mouseSmooth.x, mouseTarget.x, 0.06);
      mouseSmooth.y = lerp(mouseSmooth.y, mouseTarget.y, 0.06);

      updatePointer();

      const t = performance.now() / 1000;
      const dt = Math.min(0.05, t - t0);
      t0 = t;

      material.uniforms.uTime.value = t;

      // Drift surge on scroll
      uDrift += dt * (CONFIG.drift + scrollCurrent * CONFIG.scrollDrift);
      material.uniforms.uDrift.value = uDrift;

      // Forward camera dive on scroll & parallax
      camera.position.set(
        mouseSmooth.x * CONFIG.parallax,
        mouseSmooth.y * CONFIG.parallax,
        5 - scrollCurrent * CONFIG.scrollPush
      );
      camera.lookAt(mouseSmooth.x * CONFIG.parallax, mouseSmooth.y * CONFIG.parallax, -10);

      // Appear fade-in
      const elapsed = performance.now() - appearStart;
      const fade = clamp((elapsed - 300) / 1400, 0, 1);
      material.uniforms.uOpacity.value = fade * CONFIG.opacity;

      // Barrel spin on Z
      group.rotation.z += dt * (CONFIG.spin + scrollCurrent * CONFIG.scrollSpin);

      // Corner-flame time
      finalPass.uniforms.iTime.value = t;

      // Render composers
      camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render();
      camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render();
      camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render();
    }
    requestAnimationFrame(animate);

    // Resize
    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio;

      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      torusComposer.setPixelRatio(dpr);
      torusComposer.setSize(w, h);

      bloomComposer.setPixelRatio(dpr);
      bloomComposer.setSize(w, h);

      finalComposer.setPixelRatio(dpr);
      finalComposer.setSize(w, h);

      const max = document.documentElement.scrollHeight - window.innerHeight;
      scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);
    resize();
  </script>
</body>
</html>
